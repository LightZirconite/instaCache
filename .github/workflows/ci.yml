name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build in release mode
        run: cargo build --release --locked

      - name: Verify the binary runs
        run: ./target/release/gramcache --version

  packaging:
    name: Validate the packaging
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y desktop-file-utils shellcheck

      - name: Validate the desktop entry
        run: desktop-file-validate gramcache.desktop

      - name: Lint the shell scripts
        run: |
          shellcheck --severity=warning --shell=sh install.sh uninstall.sh
          shellcheck --severity=warning --shell=bash scripts/release.sh

      - name: Check that the SVG icon is well-formed
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('assets/gramcache.svg')"
