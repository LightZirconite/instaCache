name: Release

# Publishing is driven entirely by the tag: pushing `v1.2.3` builds the
# binaries, packages them and creates the matching GitHub Release.
# `scripts/release.sh` is what creates and pushes that tag.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Plain `qmake` is still Qt 5 on several distributions, so the Qt bindings
  # are pointed at the Qt 6 one explicitly rather than left to PATH order.
  QMAKE: qmake6

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Built inside Debian 12, which is exactly the baseline instaCache claims to
    # support: Qt 6.4 and glibc 2.36. Both halves matter and pull in opposite
    # directions, which is why the runner's own distribution is not used.
    #
    #   * Too new a glibc and the binary refuses to start on Debian 12.
    #   * Too old a Qt and it does not build at all -- Ubuntu 22.04 carries Qt
    #     6.2, below the baseline, and the release built there failed while the
    #     same commit built fine on 24.04.
    #
    # Debian 12 is the one environment where both are right at once.
    container: debian:12

    # Stated rather than left to the default. Inside a container the default
    # shell falls back to `sh` when bash is not found, and `set -o pipefail`
    # is a bash-ism: under dash it fails with "Illegal option", which exits 2
    # and looks nothing like a shell problem from the outside.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64

    steps:
      # Before the checkout, because the container starts without git, curl or
      # certificates and every later step needs them.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential \
            pkg-config \
            ca-certificates \
            curl \
            git \
            xz-utils \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-webengine-dev \
            libgl1-mesa-dev \
            librsvg2-bin
          qmake6 -query QT_VERSION

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # Said out loud, because a missing checkout used to surface only as
          # grep's exit code -- which is 2 for an unreadable file and reads as
          # a shell error, not a missing repository.
          if [ ! -f Cargo.toml ]; then
            echo "::error::Cargo.toml is not in $PWD; the checkout did not land here"
            ls -a | sed 's/^/::error::  /'
            exit 1
          fi
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$version" != "$manifest" ]; then
            echo "::error::Tag $tag does not match the version in Cargo.toml ($manifest)."
            echo "::error::Run scripts/release.sh instead of tagging by hand."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The tail of a failed build is repeated as annotations, which are
      # readable from the run without administrator rights on the repository.
      # Job logs are not, and a release that fails where nobody can see why
      # costs an afternoon.
      - name: Build
        run: |
          set -o pipefail
          if ! cargo build --release --locked 2>&1 | tee /tmp/build.log; then
            tail -n 40 /tmp/build.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Verify the binary runs
        run: ./target/release/instacache --version

      - name: Assemble the archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          name="instacache-${VERSION}-linux-${ARCH}"
          mkdir -p "dist/${name}/assets"

          cp target/release/instacache      "dist/${name}/"
          cp instacache.desktop             "dist/${name}/"
          cp install.sh uninstall.sh get.sh "dist/${name}/"
          cp assets/instacache.svg          "dist/${name}/assets/"
          cp README.md LICENSE             "dist/${name}/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "dist/${name}/" || true
          chmod +x "dist/${name}/instacache" "dist/${name}"/*.sh

          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download every architecture
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            # Prefer the hand-written section from CHANGELOG.md when it exists;
            # fall back to the commit log since the previous tag.
            if [ -f CHANGELOG.md ] && grep -q "^## \[\?${version}\]\?" CHANGELOG.md; then
              awk -v v="${version}" '
                $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md
            else
              previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
              echo "### Changes"
              echo
              if [ -n "$previous" ]; then
                git log --no-merges --pretty='- %s (%h)' "${previous}..${TAG}"
              else
                git log --no-merges --pretty='- %s (%h)' "${TAG}"
              fi
            fi

            echo
            echo "### Install"
            echo
            echo "One command:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/get.sh | sh"
            echo '```'
            echo
            echo "It downloads the archive below for your architecture, verifies it against"
            echo "the checksum, installs instaCache into \`~/.local\` without root, adds it to"
            echo "your application menu, and offers to install the Qt 6 packages it needs."
            echo
            echo "On Arch and its derivatives, \`yay -S instacache-bin\` is the packaged route;"
            echo "it is published from this release automatically."
            echo
            echo "Or unpack an archive yourself and run \`./install.sh\` inside it."
            echo "Uninstall with \`~/.local/share/instacache/uninstall.sh\`."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat artifacts/*.sha256 2>/dev/null || true
            echo '```'
          } > release-notes.md

          cat release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: instaCache ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true

  aur:
    name: Publish instacache-bin to the AUR
    needs: publish
    runs-on: ubuntu-latest
    # A pre-release is not what `pacman -Syu` should hand to everybody, and
    # the AUR has no channel for one. Stable tags only.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Nothing here is secret. The step that needs the key is the push, and
      # it is skipped entirely when the key is not configured -- so a fork,
      # and this repository before the AUR account exists, still releases.
      - name: Render PKGBUILD and .SRCINFO from the published release
        id: render
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The release assets are what the checksums are read from, so this
          # runs after `publish` and not beside it.
          ./packaging/aur/render.sh "$version" aur-out
          echo "--- PKGBUILD ---"
          cat aur-out/PKGBUILD
          echo "--- .SRCINFO ---"
          cat aur-out/.SRCINFO

      - name: Is the AUR key configured?
        id: key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; the package was rendered but not pushed."
          fi

      # Pushed with plain git rather than a third-party action: the AUR SSH
      # key is the one credential here that can publish under somebody's name,
      # and this keeps it out of code nobody in this repository reviews.
      #
      # The host keys are fetched and then VERIFIED against the fingerprints
      # the AUR publishes. A bare `ssh-keyscan` trusts whatever answers on the
      # network, which is the whole attack. If the AUR ever rotates a key this
      # fails loudly, which is the behaviour you want: update the list below
      # from <https://aur.archlinux.org/> and look at why it changed.
      - name: Push to the AUR
        if: steps.key.outputs.present == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ vars.AUR_USERNAME || 'LightZirconite' }}
          AUR_EMAIL: ${{ vars.AUR_EMAIL || 'max.freq@ik.me' }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          expected='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI
          SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8'

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          # Every key offered must be one we already trust, and all three must
          # be there -- so a downgrade to a single unexpected key cannot pass.
          seen=0
          while read -r _bits fingerprint _rest; do
            [ -n "$fingerprint" ] || continue
            if ! printf '%s\n' "$expected" | tr -d ' ' | grep -qxF "$fingerprint"; then
              echo "::error::Unknown AUR host key $fingerprint -- refusing to push."
              exit 1
            fi
            seen=$((seen + 1))
          done <<EOF
          $(ssh-keygen -lf ~/.ssh/known_hosts)
          EOF
          if [ "$seen" -ne 3 ]; then
            echo "::error::Expected 3 AUR host keys, verified $seen -- refusing to push."
            exit 1
          fi
          echo "Verified $seen AUR host keys against the published fingerprints."

          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # BatchMode so a missing or malformed key fails instead of reaching
          # for an askpass helper that is not there, and the known_hosts we
          # just verified is named rather than assumed.
          ssh_options="-i $HOME/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes"
          ssh_options="$ssh_options -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          ssh_options="$ssh_options -o StrictHostKeyChecking=yes"
          export GIT_SSH_COMMAND="ssh $ssh_options"

          # The key is only useful once it is attached to an AUR account, and
          # AUR registration is closed from time to time. Asked first, and
          # answered three ways on purpose -- an earlier version only looked
          # for "Permission denied", so an empty key reported success and the
          # failure surfaced as an unreadable git error forty lines later.
          auth=$(ssh $ssh_options aur@aur.archlinux.org 2>&1 || true)
          if printf '%s' "$auth" | grep -qiE 'Welcome to AUR|Interactive shell is disabled'; then
            echo "Authenticated to the AUR."
          elif printf '%s' "$auth" | grep -q 'Permission denied'; then
            echo "::warning::The AUR key is not attached to an account yet, so instacache-bin was not published. The release itself is unaffected. Add this public key to the AUR account, then re-run this job:"
            ssh-keygen -y -f ~/.ssh/aur || true
            exit 0
          else
            echo "::error::Could not reach the AUR, and it is not a missing account:"
            printf '%s\n' "$auth"
            exit 1
          fi

          # A package that does not exist yet has no repository to clone, so
          # the working copy is built either way and the push creates it.
          rm -rf aur-repo && mkdir aur-repo && cd aur-repo
          git init -q -b master
          git remote add origin ssh://aur@aur.archlinux.org/instacache-bin.git
          git fetch --depth 1 origin master 2>/dev/null && git reset -q --hard FETCH_HEAD || \
            echo "instacache-bin does not exist on the AUR yet; this push creates it."

          cp ../aur-out/PKGBUILD ../aur-out/.SRCINFO .
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::The AUR package is already at this version; nothing to push."
            exit 0
          fi
          git -c user.name="$AUR_USERNAME" -c user.email="$AUR_EMAIL" \
              commit -q -m "instacache-bin ${TAG#v}"
          git push origin master
          echo "Pushed instacache-bin ${TAG#v} to the AUR."
