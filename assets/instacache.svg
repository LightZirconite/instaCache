<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="instaCache">
  <title>instaCache</title>
  <defs>
    <radialGradient id="ic-brand" gradientUnits="userSpaceOnUse" cx="61" cy="258" r="312">
      <stop offset="0%"   stop-color="#FFD25A"/>
      <stop offset="20%"  stop-color="#FF9A3C"/>
      <stop offset="42%"  stop-color="#F4503E"/>
      <stop offset="62%"  stop-color="#DD2A7B"/>
      <stop offset="82%"  stop-color="#9B30B8"/>
      <stop offset="100%" stop-color="#5145D8"/>
    </radialGradient>
    <linearGradient id="ic-sheen" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="248">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="48%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <!-- The ring is cut where the bolt crosses it. -->
    <mask id="ic-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#ffffff"/>
      <path d="M150 44 86 140h38l-18 72 68-102h-40z" fill="#000000"
            stroke="#000000" stroke-width="26" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Body -->
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#ic-brand)"/>

  <!-- Lens -->
  <circle cx="128" cy="130" r="62" fill="none" stroke="#ffffff" stroke-width="20"
          mask="url(#ic-cut)"/>

  <!-- Bolt: the cache -->
  <path d="M150 44 86 140h38l-18 72 68-102h-40z" fill="#ffffff" stroke="#ffffff"
        stroke-width="6" stroke-linejoin="round"/>

  <!-- Light from above, over everything -->
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#ic-sheen)"/>
</svg>
