[package]
name = "instacache"
version = "2.1.0"
edition = "2021"
rust-version = "1.82"
description = "Ultra-light native Instagram desktop client for Linux, with aggressive persistent caching"
authors = ["instaCache contributors"]
license = "MIT"
repository = "https://git.justw.tf/LightZirconite/instaCache"
readme = "README.md"
keywords = ["instagram", "chromium", "qt", "desktop", "linux"]
categories = ["gui"]

[dependencies]
dirs = "6"
# The window and the web view. `webengine` is what pulls in Qt WebEngine and
# provides the initialisation call that has to run before QGuiApplication.
qmetaobject = { version = "0.2.10", features = ["webengine"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desktop notifications. The `z` backend speaks the freedesktop protocol over
# pure-Rust D-Bus, so packaging gains no system development package; the
# default `d` backend would require libdbus headers at build time.
notify-rust = { version = "4.17", default-features = false, features = ["z"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
