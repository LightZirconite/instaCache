[package]
name = "instacache"
version = "2.8.0"
edition = "2021"
rust-version = "1.82"
description = "Ultra-light native Instagram desktop client for Linux, with aggressive persistent caching"
authors = ["LightZirconite"]
license = "AGPL-3.0-or-later"
repository = "https://git.justw.tf/LightZirconite/instaCache"
readme = "README.md"
keywords = ["instagram", "chromium", "qt", "desktop", "linux"]
categories = ["gui"]

[dependencies]
# One C++ call this project cannot do without and no binding exposes:
# QGuiApplication::setDesktopFileName. See `sites::announce_desktop_file`.
cpp = "0.5"
dirs = "6"
qttypes = "0.2"
# The window and the web view. `webengine` is what pulls in Qt WebEngine and
# provides the initialisation call that has to run before QGuiApplication.
qmetaobject = { version = "0.2.10", features = ["webengine"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# D-Bus, in pure Rust, so packaging gains no system development package:
# notifications, Do Not Disturb and the unread badge, all over one connection.
# See `bus.rs`. It replaced `notify-rust`, which opened a connection and held
# a thread for every notification, and unwrapped D-Bus errors.
zbus = "5"

[build-dependencies]
cpp_build = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
